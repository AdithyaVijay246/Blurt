[package]
name = "blurt-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tauri = { workspace = true }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
uuid = "1.24.1"

# Domain crates. blurt-app is the adapter that calls into these; it holds no
# business logic of its own (docs/MODULE_01_ARCHITECTURE.md §2).
blurt-schema = { workspace = true }
blurt-router = { workspace = true }
blurt-rag = { workspace = true }
blurt-sync = { workspace = true }

# Module 4's handles are opened lazily behind an async mutex, and generation
# leaves the runtime via spawn_blocking. A `std` guard is not `Send`, which a
# Tauri async command's future must be. `time` drives the indexer's edit
# debounce (MODULE_04 §3).
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "macros", "time"] }

[dev-dependencies]
# "test" feature gates the tauri::test mock-runtime module used by command tests.
tauri = { workspace = true, features = ["test"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
# Paused-clock tests for the edit debounce: time only advances when every task
# is idle, so a 1.5s wait costs nothing and cannot flake.
tokio = { version = "1", features = ["test-util"] }
